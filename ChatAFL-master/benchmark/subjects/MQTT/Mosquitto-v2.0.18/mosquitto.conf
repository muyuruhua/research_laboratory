listener 1883 0.0.0.0
allow_anonymous true
max_connections -1
log_type none
persistence false
user root

# V4-1: Bridge mode fuzzing — exercises mosquitto bridge code paths:
#   bridge__connect(), bridge__on_connect(), bridge_topic__process(),
#   bridge__packet__write(), context__init_bridge(), bridge__connect__step2().
# Target: mqtt-stable reference broker on Docker network (created by run_dev.sh).
# When mqtt-stable is unreachable (single-broker mode), bridge__connect()
# fails fast and retries after restart_timeout — still exercises error/retry paths.
connection bridge-stable
address mqtt-stable:1883
topic # both 2
topic test/# out 1
topic bridge/# in 1
restart_timeout 1
keepalive_interval 600
remote_clientid afl-bridge
bridge_protocol_version mqttv50
notifications true
cleansession true
