# Mosquitto Configuration for Fuzzing

# Network Settings
listener 1883
protocol mqtt

# Persistence Settings
persistence false
persistence_location /tmp/

# Logging
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_timestamp true

# Security (disabled for fuzzing)
allow_anonymous true

# Connection Settings
max_connections -1
max_inflight_messages 100
max_queued_messages 100

# Performance
autosave_interval 0
autosave_on_changes false
