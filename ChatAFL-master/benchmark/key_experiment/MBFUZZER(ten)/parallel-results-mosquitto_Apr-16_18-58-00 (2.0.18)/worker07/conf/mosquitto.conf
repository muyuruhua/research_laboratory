# ═══════════════════════════════════════════════════════════════════════════
# mosquitto-gcov.conf (v2.0.x)
#
# OCP-compliant EXTENSION config for gcov-instrumented campaigns.
# The original Docker/conf/mosquitto.conf is NOT modified.
#
# Aligned with ChatAFL's mosquitto.conf where possible,
# plus bridge config required by MBFuzzer's architecture.
#
# ChatAFL baseline: listener 1883 127.0.0.1, allow_anonymous true,
#   max_connections -1, log_type none, persistence false, user root
# ═══════════════════════════════════════════════════════════════════════════

# ─── Listener (matching ChatAFL) ─────────────────────────────────────────
listener 1883
allow_anonymous true
max_connections -1
log_type none
persistence false
user root

# ─── Bridge to MBFuzzer server_module on host ────────────────────────────
# The address is patched at runtime by run_mosquitto_parallel_docker.sh
connection bridge1
address 172.199.0.1:1894
restart_timeout 1
topic topic both 1 local/ remote/
topic topic both 1

keepalive_interval 600
remote_clientid mosquitto

#bridge_protocol_version mqttv311
bridge_protocol_version mqttv50

notifications false
cleansession true
